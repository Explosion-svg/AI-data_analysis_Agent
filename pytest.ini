[pytest]
# P4-1：限定测试收集目录为 tests/，避免从根目录收集时把脚本（如 run_load_test.py）
# 误当作测试文件导入。
testpaths = tests

# 只收集 test_*.py，排除 *_test.py（run_load_test.py 恰好匹配 *_test.py 的默认 glob，
# 会被 pytest 误收集并 import）。
python_files = test_*.py

# 测试目录是包（tests/__init__.py），避免 rootdir 重复插入 sys.path 导致导入错乱
norecursedirs = venv .git Demo
